<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Exam Roadmap — Four Subjects</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#E7F0F8;
    --paper-grid:#CFE0EE;
    --card:#FAFDFF;
    --ink:#101C2B;
    --ink-soft:#4C5E72;
    --ink-faint:#7D90A3;
    --line:#C2D4E6;
    --navy:#081A2E;
    --navy-soft:#0F2A46;

    --must:#A8362E;
    --must-bg:#F7E6E3;
    --high:#B8762B;
    --high-bg:#F6ECDA;
    --med:#2878A8;
    --med-bg:#DCEBF4;
    --low:#5E6B78;
    --low-bg:#E2E8EE;

    --radius-s:3px;
    --radius-m:6px;

    color-scheme: light;
  }
  :root{ box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
  html{ scroll-padding-top:86px; }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:
      linear-gradient(var(--paper-grid) 1px, transparent 1px) 0 0/100% 34px,
      linear-gradient(90deg, var(--paper-grid) 1px, transparent 1px) 0 0/34px 100%,
      var(--paper);
    background-attachment:local;
    color:var(--ink);
    font-family:'Inter', -apple-system, sans-serif;
    -webkit-font-smoothing:antialiased;
    font-size:15.5px;
    line-height:1.55;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#0A1626;
      --paper-grid:#122234;
      --card:#0F2036;
      --ink:#E4ECF6;
      --ink-soft:#9FB1C6;
      --ink-faint:#6D8097;
      --line:#20334C;
      --navy:#050E1A;
      --navy-soft:#0A1C30;
      --must-bg:#3A201D;
      --high-bg:#392D1B;
      --med-bg:#132A3B;
      --low-bg:#1C2530;
    }
  }
  :root[data-theme="dark"]{
    --paper:#0A1626; --paper-grid:#122234; --card:#0F2036; --ink:#E4ECF6;
    --ink-soft:#9FB1C6; --ink-faint:#6D8097; --line:#20334C; --navy:#050E1A; --navy-soft:#0A1C30;
    --must-bg:#3A201D; --high-bg:#392D1B; --med-bg:#132A3B; --low-bg:#1C2530;
  }

  h1,h2,h3,h4{ font-family:'Fraunces', Georgia, serif; font-weight:600; margin:0; color:var(--ink); }
  .mono{ font-family:'JetBrains Mono', monospace; }
  a{ color:inherit; }
  ::selection{ background: color-mix(in srgb, var(--accent, #1C86B4) 30%, transparent); }
  :focus-visible{ outline:2px solid var(--accent, #1C86B4); outline-offset:2px; border-radius:3px; }

  /* ---------- header ---------- */
  header.topbar{
    position:sticky; top:0; z-index:40;
    background:var(--navy);
    padding:env(safe-area-inset-top,0px) 0 0 0;
    border-bottom:1px solid #000;
  }
  .topbar-inner{
    max-width:1180px; margin:0 auto; padding:14px 22px 0;
    display:flex; align-items:center; gap:22px; flex-wrap:wrap;
  }
  .brand{
    display:flex; align-items:baseline; gap:9px; margin-right:auto;
    color:#F3F1EA;
  }
  .brand .mark{
    width:9px; height:9px; border-radius:1px;
    background:var(--accent, #1C86B4);
    display:inline-block; transform:rotate(45deg);
    flex:none;
  }
  .brand .t1{ font-family:'Fraunces', serif; font-weight:600; font-size:17px; letter-spacing:.2px; }
  .brand .t2{ font-size:11.5px; color:#9CA39B; font-family:'JetBrains Mono',monospace; }

  .tabs{ display:flex; gap:2px; }
  .tab{
    appearance:none; border:none; background:transparent; cursor:pointer;
    color:#B8BDB3; font-family:'Inter',sans-serif; font-weight:600; font-size:13.5px;
    padding:10px 15px 12px; border-radius:7px 7px 0 0; position:relative;
    transition:color .15s ease, background .15s ease;
    white-space:nowrap;
  }
  .tab .dot{ display:inline-block; width:6px; height:6px; border-radius:50%; margin-right:7px; background:#5a7085; vertical-align:middle; }
  .tab:hover{ color:#EDF3F8; }
  .tab.active{ color:var(--ink); background:var(--card); }
  .tab.active .dot{ background:var(--accent); }

  .tabs-scroll{ overflow-x:auto; -ms-overflow-style:none; scrollbar-width:none; position:relative; }
  .tabs-scroll::-webkit-scrollbar{ display:none; }
  .tabs-scroll{ -webkit-mask-image:linear-gradient(to right, transparent 0, #000 14px, #000 calc(100% - 14px), transparent 100%); mask-image:linear-gradient(to right, transparent 0, #000 14px, #000 calc(100% - 14px), transparent 100%); }

  .theme-toggle{
    appearance:none; border:1px solid #2A3B52; background:var(--navy-soft); color:#CBD6E3;
    cursor:pointer; border-radius:20px; padding:6px 12px 6px 10px; font-family:'Inter',sans-serif;
    font-size:12px; font-weight:600; display:flex; align-items:center; gap:7px; flex:none;
    transition:border-color .15s ease, color .15s ease;
  }
  .theme-toggle:hover{ color:#fff; border-color:#3C526F; }
  .theme-toggle svg{ width:14px; height:14px; flex:none; }

  /* ---------- layout ---------- */
  .page{ max-width:1180px; margin:0 auto; padding:0 22px 90px; }
  .layout{ display:grid; grid-template-columns:220px 1fr; gap:38px; align-items:start; padding-top:30px; }
  @media (max-width:860px){ .layout{ grid-template-columns:1fr; } }

  nav.sidenav{ position:sticky; top:78px; display:flex; flex-direction:column; gap:1px; }
  @media (max-width:860px){
    nav.sidenav{ position:static; flex-direction:row; overflow-x:auto; gap:6px; padding-bottom:6px; margin-bottom:6px; border-bottom:1px solid var(--line); }
  }
  nav.sidenav a{
    text-decoration:none; color:var(--ink-soft); font-size:13px; font-weight:500;
    padding:7px 10px; border-left:2px solid transparent; white-space:nowrap;
  }
  @media (max-width:860px){ nav.sidenav a{ border-left:none; border-bottom:2px solid transparent; flex:none; } }
  nav.sidenav a:hover{ color:var(--ink); }
  nav.sidenav a.current{ color:var(--accent); border-left-color:var(--accent); font-weight:700; }
  @media (max-width:860px){ nav.sidenav a.current{ border-bottom-color:var(--accent); border-left:none; } }

  /* ---------- hero ---------- */
  .hero{ padding:8px 0 22px; border-bottom:1px solid var(--line); margin-bottom:30px; }
  .hero-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:24px; flex-wrap:wrap; }
  .hero h1{ font-size:clamp(28px,4vw,40px); line-height:1.05; letter-spacing:-.01em; }
  .hero .code{ font-family:'JetBrains Mono',monospace; font-size:13px; color:var(--accent); margin-top:9px; display:block; letter-spacing:.02em; }
  .ring-stat{ text-align:right; flex:none; }
  .ring-stat .pct{ font-family:'Fraunces',serif; font-size:30px; font-weight:600; color:var(--accent); line-height:1; }
  .ring-stat .lbl{ font-size:11.5px; color:var(--ink-faint); margin-top:3px; }
  .ring-stat .reset{ appearance:none; border:none; background:none; cursor:pointer; font-size:11px; color:var(--ink-faint); text-decoration:underline; text-underline-offset:2px; padding:5px 0 0; font-family:'Inter',sans-serif; }
  .ring-stat .reset:hover{ color:var(--accent); }
  .hero-sub{ color:var(--ink-soft); font-size:14.5px; margin-top:12px; max-width:640px; }

  .caveat{
    margin-top:18px; padding:14px 16px; background:var(--high-bg); border-left:3px solid var(--high);
    border-radius:0 var(--radius-m) var(--radius-m) 0; font-size:13.5px; color:var(--ink);
  }
  .caveat b{ display:block; font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--high); margin-bottom:5px; font-weight:700;}

  /* ---------- sections ---------- */
  section.block{ margin-bottom:46px; scroll-margin-top:84px; }
  .block-head{ display:flex; align-items:baseline; gap:11px; margin-bottom:16px; }
  .block-head h2{ font-size:21px; }
  .block-head .idx{ font-family:'JetBrains Mono',monospace; color:var(--ink-faint); font-size:12.5px; }
  .block-note{ color:var(--ink-soft); font-size:13.5px; margin:-9px 0 16px; max-width:680px; }

  /* priority badge */
  .pri{ display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:700; padding:3px 8px 3px 7px; border-radius:20px; white-space:nowrap; letter-spacing:.01em; }
  .pri::before{ content:""; width:6px; height:6px; border-radius:50%; flex:none; }
  .pri.MUST{ color:var(--must); background:var(--must-bg); }
  .pri.MUST::before{ background:var(--must); }
  .pri.HIGH{ color:var(--high); background:var(--high-bg); }
  .pri.HIGH::before{ background:var(--high); }
  .pri.MEDIUM{ color:var(--med); background:var(--med-bg); }
  .pri.MEDIUM::before{ background:var(--med); }
  .pri.LOW{ color:var(--low); background:var(--low-bg); }
  .pri.LOW::before{ background:var(--low); }

  .legend{ display:flex; gap:14px; flex-wrap:wrap; margin:4px 0 26px; }
  .legend span.pri{ font-size:10.5px; }

  /* tables */
  .twrap{ border:1px solid var(--line); border-radius:var(--radius-m); overflow:hidden; background:var(--card); }
  table{ width:100%; border-collapse:collapse; font-size:13.5px; }
  thead th{
    text-align:left; font-family:'Inter',sans-serif; font-weight:600; font-size:11px;
    color:var(--ink-faint); text-transform:none; padding:10px 14px; border-bottom:1px solid var(--line);
    background:color-mix(in srgb, var(--accent) 5%, var(--card));
  }
  tbody td{ padding:10px 14px; border-bottom:1px solid var(--line); vertical-align:top; }
  tbody tr:last-child td{ border-bottom:none; }
  tbody tr:hover{ background:color-mix(in srgb, var(--accent) 4%, transparent); }
  td.unit{ font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--ink-soft); white-space:nowrap; }
  td.num{ font-family:'JetBrains Mono',monospace; font-size:12.5px; color:var(--ink-soft); white-space:nowrap; }
  td.concept{ font-weight:500; }

  /* ranked list (high ROI) */
  ol.ranked{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:9px; }
  ol.ranked li{
    display:flex; gap:14px; align-items:flex-start; background:var(--card); border:1px solid var(--line);
    border-radius:var(--radius-m); padding:13px 16px;
  }
  ol.ranked .rank{
    font-family:'Fraunces',serif; font-weight:600; font-size:17px; color:var(--accent);
    flex:none; width:26px; text-align:right; line-height:1.4;
  }
  ol.ranked .txt{ font-size:14px; line-height:1.5; }

  /* mcq checklist grid */
  .chk-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:9px; }
  label.chk{
    display:flex; gap:10px; align-items:flex-start; background:var(--card); border:1px solid var(--line);
    border-radius:var(--radius-m); padding:11px 13px; font-size:13px; cursor:pointer; line-height:1.45;
    transition:border-color .15s ease, background .15s ease;
  }
  label.chk:hover{ border-color:var(--accent); }
  label.chk input{ margin-top:2px; accent-color:var(--accent); flex:none; width:15px; height:15px; cursor:pointer; }
  label.chk.done{ background:color-mix(in srgb, var(--accent) 7%, var(--card)); }
  label.chk.done span{ color:var(--ink-soft); text-decoration:line-through; text-decoration-color:var(--ink-faint); }

  /* strategy callouts */
  .strategy-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:14px; }
  @media (max-width:760px){ .strategy-grid{ grid-template-columns:1fr; } }
  .strat-card{ background:var(--card); border:1px solid var(--line); border-radius:var(--radius-m); padding:16px 17px; border-top:3px solid var(--line); }
  .strat-card h4{ font-family:'Inter',sans-serif; font-size:11px; text-transform:uppercase; letter-spacing:.06em; font-weight:700; margin-bottom:9px; }
  .strat-card.floor{ border-top-color:var(--med); } .strat-card.floor h4{ color:var(--med); }
  .strat-card.push{ border-top-color:var(--accent); } .strat-card.push h4{ color:var(--accent); }
  .strat-card.keep{ border-top-color:var(--must); } .strat-card.keep h4{ color:var(--must); }
  .strat-card p{ margin:0; font-size:13.5px; color:var(--ink); line-height:1.6; }

  /* study order */
  .steps{ display:flex; flex-direction:column; }
  .step{ display:grid; grid-template-columns:40px 1fr; gap:16px; padding:17px 0; border-bottom:1px solid var(--line); }
  .step:last-child{ border-bottom:none; }
  .step .n{ font-family:'Fraunces',serif; font-size:19px; font-weight:600; color:var(--accent); }
  .step h4{ font-size:14.5px; font-weight:700; font-family:'Inter',sans-serif; margin-bottom:4px; }
  .step p{ margin:0; font-size:13.5px; color:var(--ink-soft); line-height:1.6; }

  /* prediction tiers */
  .tier{ margin-bottom:16px; border-radius:var(--radius-m); overflow:hidden; border:1px solid var(--line); }
  .tier-head{ padding:9px 15px; font-weight:700; font-size:12px; text-transform:uppercase; letter-spacing:.05em; }
  .tier.high .tier-head{ background:var(--must-bg); color:var(--must); }
  .tier.medium .tier-head{ background:var(--high-bg); color:var(--high); }
  .tier.low .tier-head{ background:var(--low-bg); color:var(--low); }
  .tier ul{ margin:0; padding:13px 18px 13px 32px; background:var(--card); font-size:13.5px; line-height:1.7; }
  .tier li{ margin-bottom:3px; }
  .pred-note{ font-size:13px; color:var(--ink-faint); font-style:italic; margin-top:4px; }

  /* top20 */
  .top20{ display:flex; flex-direction:column; gap:7px; }
  .t20-row{ display:flex; gap:12px; align-items:flex-start; padding:9px 13px; border:1px solid var(--line); border-radius:var(--radius-s); background:var(--card); }
  .t20-row .rn{ font-family:'JetBrains Mono',monospace; font-size:11.5px; color:var(--ink-faint); flex:none; width:20px; padding-top:1px; }
  .t20-row input{ margin-top:2px; accent-color:var(--accent); flex:none; width:14px; height:14px; cursor:pointer; }
  .t20-row span{ font-size:13.5px; line-height:1.5; }
  .t20-row.done span{ color:var(--ink-soft); text-decoration:line-through; text-decoration-color:var(--ink-faint); }
  .t20-row label{ display:flex; gap:10px; align-items:flex-start; cursor:pointer; flex:1; }

  /* final order + last minute */
  .finalbox{ background:var(--card); border:1px solid var(--line); border-radius:var(--radius-m); padding:18px 20px; font-size:14px; line-height:1.7; color:var(--ink); }
  .lastmin{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:8px; }
  .lastmin li{ display:flex; gap:11px; align-items:flex-start; font-size:13.5px; line-height:1.55; }
  .lastmin li::before{ content:"—"; color:var(--accent); flex:none; font-weight:700; }

  footer{ text-align:center; padding:34px 20px 50px; color:var(--ink-faint); font-size:12px; }

  /* panel switching */
  .panel{ display:none; }
  .panel.active{ display:block; animation:fade .35s ease; }
  @keyframes fade{ from{ opacity:0; transform:translateY(4px); } to{ opacity:1; transform:translateY(0); } }

  @media (max-width:480px){
    .strategy-grid{ grid-template-columns:1fr; }
    table{ font-size:12.5px; }
    thead th, tbody td{ padding:8px 10px; }
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brand"><span class="mark"></span><span class="t1">Exam Roadmap</span><span class="t2">Oct/Nov 2026 · 4 subjects</span></div>
    <div class="tabs-scroll"><div class="tabs" id="tabs"></div></div>
    <button type="button" class="theme-toggle" id="themeToggle"></button>
  </div>
</header>

<div class="page">
  <div id="panels"></div>
</div>

<footer
  ♥︎ Crafted exclusively for Arya ♥︎
</footer>

<template id="tpl-panel">
<div class="layout">
  <nav class="sidenav">
    <a href="#" data-sec="syllabus">Syllabus priority</a>
    <a href="#" data-sec="repeated">Repeated questions</a>
    <a href="#" data-sec="roi">High-ROI ranking</a>
    <a href="#" data-sec="mcq">MCQ checklist</a>
    <a href="#" data-sec="strategy">65+/70 strategy</a>
    <a href="#" data-sec="units">Unit priority</a>
    <a href="#" data-sec="order">Study order</a>
    <a href="#" data-sec="prediction">2026 prediction</a>
    <a href="#" data-sec="top20">Top 20</a>
    <a href="#" data-sec="final">Final order &amp; revision</a>
  </nav>
  <main>
    <div class="hero">
      <div class="hero-top">
        <div>
          <h1 data-f="fullName"></h1>
          <span class="code mono" data-f="code"></span>
        </div>
        <div class="ring-stat">
          <div class="pct"><span data-f="pct">0</span>%</div>
          <div class="lbl">checklist complete</div>
          <button type="button" class="reset" data-f="resetBtn">reset progress</button>
        </div>
      </div>
      <p class="hero-sub" data-f="intro"></p>
      <div class="caveat" data-f="caveatBox" style="display:none;">
        <b>Syllabus note</b>
        <span data-f="caveat"></span>
      </div>
    </div>

    <section class="block" id="sec-syllabus">
      <div class="block-head"><span class="idx">01</span><h2>Syllabus × PYQ priority</h2></div>
      <div class="legend">
        <span class="pri MUST">must do</span><span class="pri HIGH">high</span><span class="pri MEDIUM">medium</span><span class="pri LOW">low</span>
      </div>
      <div class="twrap"><table data-f="syllabusTable"></table></div>
    </section>

    <section class="block" id="sec-repeated">
      <div class="block-head"><span class="idx">02</span><h2>Repeated questions</h2></div>
      <p class="block-note">Concepts that recur across old and new syllabus papers — frequency is how many of the available past papers tested it.</p>
      <div class="twrap"><table data-f="repeatedTable"></table></div>
    </section>

    <section class="block" id="sec-roi">
      <div class="block-head"><span class="idx">03</span><h2>High-ROI questions, ranked</h2></div>
      <ol class="ranked" data-f="roiList"></ol>
    </section>

    <section class="block" id="sec-mcq">
      <div class="block-head"><span class="idx">04</span><h2>MCQ checklist</h2></div>
      <p class="block-note">Tick items off as you lock them in — your progress is saved on this device and feeds the completion ring above.</p>
      <div class="chk-grid" data-f="mcqGrid"></div>
    </section>

    <section class="block" id="sec-strategy">
      <div class="block-head"><span class="idx">05</span><h2>Strategy to clear 65+/70</h2></div>
      <div class="strategy-grid">
        <div class="strat-card floor"><h4>Safe floor</h4><p data-f="stratMin"></p></div>
        <div class="strat-card push"><h4>Push further</h4><p data-f="stratPush"></p></div>
        <div class="strat-card keep"><h4>Never skip</h4><p data-f="stratSkip"></p></div>
      </div>
    </section>

    <section class="block" id="sec-units">
      <div class="block-head"><span class="idx">06</span><h2>Unit-wise priority</h2></div>
      <div class="twrap"><table data-f="unitsTable"></table></div>
    </section>

    <section class="block" id="sec-order">
      <div class="block-head"><span class="idx">07</span><h2>Study order</h2></div>
      <div class="steps" data-f="stepsList"></div>
    </section>

    <section class="block" id="sec-prediction">
      <div class="block-head"><span class="idx">08</span><h2>Oct/Nov 2026 prediction</h2></div>
      <p class="pred-note" data-f="predNoteTop" style="display:none;"></p>
      <div class="tier high"><div class="tier-head">High confidence</div><ul data-f="predHigh"></ul></div>
      <div class="tier medium"><div class="tier-head">Medium confidence</div><ul data-f="predMedium"></ul></div>
      <div class="tier low"><div class="tier-head">Low confidence</div><ul data-f="predLow"></ul></div>
      <p class="pred-note" data-f="predClosing"></p>
    </section>

    <section class="block" id="sec-top20">
      <div class="block-head"><span class="idx">09</span><h2>Top 20 — must prepare</h2></div>
      <div class="top20" data-f="top20List"></div>
    </section>

    <section class="block" id="sec-final">
      <div class="block-head"><span class="idx">10</span><h2>Final study order &amp; last-minute revision</h2></div>
      <div class="finalbox" data-f="finalOrder" style="margin-bottom:22px;"></div>
      <ul class="lastmin" data-f="lastMinList"></ul>
    </section>
  </main>
</div>
</template>

<script>
/* ============================= DATA ============================= */
const SUBJECTS = [
{
  id:'ev', shortName:'Hybrid EV', fullName:'Hybrid Electric Vehicle Design', code:'EEPEC-01C',

/* ============================= STORAGE ============================= */
function storeKey(subId){ return 'roadmap:'+subId+':checked'; }
function loadChecked(subId){
  try{
    const raw = localStorage.getItem(storeKey(subId));
    return raw ? JSON.parse(raw) : {};
  }catch(e){ return {}; }
}
function saveChecked(subId, obj){
  try{ localStorage.setItem(storeKey(subId), JSON.stringify(obj)); }catch(e){}
}

/* ============================= RENDER ============================= */
const tabsEl = document.getElementById('tabs');
const panelsEl = document.getElementById('panels');
const tpl = document.getElementById('tpl-panel');

function priBadge(code){
  const map = {MUST:'MUST DO', HIGH:'HIGH', MEDIUM:'MEDIUM', LOW:'LOW'};
  return '<span class="pri '+code+'">'+map[code]+'</span>';
}

function buildTable(rows, headers, kind){
  let th = '<thead><tr>' + headers.map(h=>'<th>'+h+'</th>').join('') + '</tr></thead>';
  let body = '<tbody>';
  rows.forEach(r=>{
    if(kind==='syllabus'){
      const [unit, topic, pri] = r;
      body += '<tr><td class="unit">Unit '+unit+'</td><td class="concept">'+topic+'</td><td>'+priBadge(pri)+'</td></tr>';
    } else if(kind==='repeated'){
      const [concept, unit, freq, marks, years, pri] = r;
      body += '<tr><td class="concept">'+concept+'</td><td class="unit">'+unit+'</td><td class="num">'+freq+'</td><td class="num">'+marks+'</td><td class="num">'+years+'</td><td>'+priBadge(pri)+'</td></tr>';
    } else if(kind==='units'){
      const [unit, topic, marks, freq, pri] = r;
      body += '<tr><td class="unit">Unit '+unit+'</td><td class="concept">'+topic+'</td><td class="num">'+marks+'</td><td>'+freq+'</td><td>'+priBadge(pri)+'</td></tr>';
    }
  });
  body += '</tbody>';
  return th + body;
}

function buildPanel(sub){
  const node = tpl.content.cloneNode(true);
  const root = node.querySelector('.layout');
  root.style.setProperty('--accent', sub.accent);

  node.querySelector('[data-f="fullName"]').textContent = sub.fullName;
  node.querySelector('[data-f="code"]').textContent = sub.code;
  node.querySelector('[data-f="intro"]').textContent = sub.intro;

  if(sub.caveat){
    const box = node.querySelector('[data-f="caveatBox"]');
    box.style.display = 'block';
    node.querySelector('[data-f="caveat"]').textContent = sub.caveat;
  }

  node.querySelector('[data-f="syllabusTable"]').innerHTML = buildTable(
    sub.syllabus, ['Unit','Topic','Priority'], 'syllabus'
  );
  node.querySelector('[data-f="repeatedTable"]').innerHTML = buildTable(
    sub.repeated, ['Concept / question','Unit','Frequency','Marks','Years seen','Priority'], 'repeated'
  );
  node.querySelector('[data-f="unitsTable"]').innerHTML = buildTable(
    sub.units, ['Unit','Topic','Typical marks','Frequency','Priority'], 'units'
  );

  const roiList = node.querySelector('[data-f="roiList"]');
  sub.roi.forEach((txt,i)=>{
    const li = document.createElement('li');
    li.innerHTML = '<span class="rank">'+(i+1)+'</span><span class="txt">'+txt+'</span>';
    roiList.appendChild(li);
  });

  // checked-state store (shared across mcq + top20 + lastmin of this subject)
  const checked = loadChecked(sub.id);
  let totalCheckable = sub.mcq.length + sub.top20.length;
  function pct(){
    let c=0;
    sub.mcq.forEach((_,i)=>{ if(checked['mcq'+i]) c++; });
    sub.top20.forEach((_,i)=>{ if(checked['t20'+i]) c++; });
    return Math.round(100*c/totalCheckable);
  }
  function updatePct(){
    root.querySelector('[data-f="pct"]').textContent = pct();
  }

  const mcqGrid = node.querySelector('[data-f="mcqGrid"]');
  sub.mcq.forEach((txt,i)=>{
    const id = 'mcq'+i;
    const label = document.createElement('label');
    label.className = 'chk' + (checked[id] ? ' done' : '');
    label.innerHTML = '<input type="checkbox" '+(checked[id]?'checked':'')+'><span>'+txt+'</span>';
    label.querySelector('input').addEventListener('change', (e)=>{
      checked[id] = e.target.checked;
      label.classList.toggle('done', e.target.checked);
      saveChecked(sub.id, checked);
      updatePct();
    });
    mcqGrid.appendChild(label);
  });

  node.querySelector('[data-f="stratMin"]').textContent = sub.strategy.min;
  node.querySelector('[data-f="stratPush"]').textContent = sub.strategy.push;
  node.querySelector('[data-f="stratSkip"]').textContent = sub.strategy.skip;

  const stepsList = node.querySelector('[data-f="stepsList"]');
  sub.steps.forEach((s,i)=>{
    const [verb, body, why] = s;
    const div = document.createElement('div');
    div.className = 'step';
    div.innerHTML = '<div class="n">'+(i+1)+'</div><div><h4>'+verb+'</h4><p>'+body+(why ? ' <span style="color:var(--ink-faint)">— '+why+'</span>' : '')+'</p></div>';
    stepsList.appendChild(div);
  });

  if(sub.prediction.note){
    const n = node.querySelector('[data-f="predNoteTop"]');
    n.style.display='block';
    n.textContent = 'Confidence note: ' + sub.prediction.note;
  }
  ['high','medium','low'].forEach(tier=>{
    const ul = node.querySelector('[data-f="pred'+tier.charAt(0).toUpperCase()+tier.slice(1)+'"]');
    sub.prediction[tier].forEach(txt=>{
      const li = document.createElement('li');
      li.textContent = txt;
      ul.appendChild(li);
    });
  });
  node.querySelector('[data-f="predClosing"]').textContent = sub.prediction.closing;

  const top20List = node.querySelector('[data-f="top20List"]');
  sub.top20.forEach((txt,i)=>{
    const id = 't20'+i;
    const row = document.createElement('div');
    row.className = 't20-row' + (checked[id] ? ' done' : '');
    row.innerHTML = '<span class="rn mono">'+String(i+1).padStart(2,'0')+'</span><label><input type="checkbox" '+(checked[id]?'checked':'')+'><span>'+txt+'</span></label>';
    row.querySelector('input').addEventListener('change',(e)=>{
      checked[id] = e.target.checked;
      row.classList.toggle('done', e.target.checked);
      saveChecked(sub.id, checked);
      updatePct();
    });
    top20List.appendChild(row);
  });

  node.querySelector('[data-f="finalOrder"]').textContent = sub.finalOrder;
  const lastMinList = node.querySelector('[data-f="lastMinList"]');
  sub.lastMin.forEach(txt=>{
    const li = document.createElement('li');
    li.textContent = txt;
    lastMinList.appendChild(li);
  });

  updatePct();

  node.querySelector('[data-f="resetBtn"]').addEventListener('click', ()=>{
    if(!confirm('Clear your checked-off progress for '+sub.shortName+'? This cannot be undone.')) return;
    Object.keys(checked).forEach(k=> delete checked[k]);
    saveChecked(sub.id, checked);
    root.querySelectorAll('.chk').forEach(el=>{ el.classList.remove('done'); el.querySelector('input').checked=false; });
    root.querySelectorAll('.t20-row').forEach(el=>{ el.classList.remove('done'); el.querySelector('input').checked=false; });
    updatePct();
  });

  return node;
}

function buildTab(sub){
  const btn = document.createElement('button');
  btn.className = 'tab';
  btn.dataset.sub = sub.id;
  btn.innerHTML = '<span class="dot"></span>'+sub.shortName;
  btn.style.setProperty('--accent', sub.accent);
  btn.addEventListener('click', ()=> activate(sub.id));
  return btn;
}

function activate(id){
  document.querySelectorAll('.tab').forEach(t=> t.classList.toggle('active', t.dataset.sub===id));
  document.querySelectorAll('.panel').forEach(p=> p.classList.toggle('active', p.dataset.sub===id));
  try{ localStorage.setItem('roadmap:lastTab', id); }catch(e){}
  window.scrollTo({top:0, behavior:'instant' in window ? 'instant' : 'auto'});
}

SUBJECTS.forEach(sub=>{
  tabsEl.appendChild(buildTab(sub));
  const panelWrap = document.createElement('div');
  panelWrap.className = 'panel';
  panelWrap.dataset.sub = sub.id;
  panelWrap.appendChild(buildPanel(sub));
  panelsEl.appendChild(panelWrap);
});

// side-nav current section highlighting via IntersectionObserver, scoped per active panel
function wireSideNav(panel){
  const links = panel.querySelectorAll('.sidenav a');
  const secs = panel.querySelectorAll('section.block');
  links.forEach(a=>{
    a.addEventListener('click',(e)=>{
      e.preventDefault();
      const target = panel.querySelector('#sec-'+a.dataset.sec);
      if(target) target.scrollIntoView({behavior:'smooth', block:'start'});
    });
  });
  const io = new IntersectionObserver((entries)=>{
    entries.forEach(entry=>{
      if(entry.isIntersecting){
        const id = entry.target.id.replace('sec-','');
        links.forEach(a=> a.classList.toggle('current', a.dataset.sec===id));
      }
    });
  }, {rootMargin:'-90px 0px -70% 0px', threshold:0});
  secs.forEach(s=> io.observe(s));
}
document.querySelectorAll('.panel').forEach(p=> wireSideNav(p));

let startId = SUBJECTS[0].id;
try{
  const last = localStorage.getItem('roadmap:lastTab');
  if(last && SUBJECTS.some(s=>s.id===last)) startId = last;
}catch(e){}
activate(startId);

/* ============================= THEME TOGGLE ============================= */
const ICONS = {
  light:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.4M12 19.1v2.4M4.2 4.2l1.7 1.7M18.1 18.1l1.7 1.7M2.5 12h2.4M19.1 12h2.4M4.2 19.8l1.7-1.7M18.1 5.9l1.7-1.7"/></svg>',
  dark:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 14.4A8.4 8.4 0 1 1 9.6 3.5a6.6 6.6 0 0 0 10.9 10.9z"/></svg>',
  system:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="12" rx="1.6"/><path d="M8.5 20h7M12 16.5V20"/></svg>',
};
const LABELS = {light:'Light', dark:'Dark', system:'Auto'};
const themeBtn = document.getElementById('themeToggle');
const THEME_ORDER = ['system','light','dark'];

function getStoredTheme(){
  try{ return localStorage.getItem('roadmap:theme') || 'system'; }catch(e){ return 'system'; }
}
function applyTheme(mode){
  if(mode==='system'){ document.documentElement.removeAttribute('data-theme'); }
  else{ document.documentElement.setAttribute('data-theme', mode); }
  themeBtn.innerHTML = ICONS[mode] + '<span>'+LABELS[mode]+'</span>';
  themeBtn.setAttribute('aria-label', 'Theme: '+LABELS[mode]+'. Click to change.');
}
function setTheme(mode){
  try{ localStorage.setItem('roadmap:theme', mode); }catch(e){}
  applyTheme(mode);
}
themeBtn.addEventListener('click', ()=>{
  const current = getStoredTheme();
  const next = THEME_ORDER[(THEME_ORDER.indexOf(current)+1) % THEME_ORDER.length];
  setTheme(next);
});
applyTheme(getStoredTheme());
</script>
